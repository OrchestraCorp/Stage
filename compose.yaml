name: orchestra-stage-dev

# Development infrastructure only. Credentials are public, fictitious defaults.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stage
      POSTGRES_USER: stage
      POSTGRES_PASSWORD: stage-dev-postgres
    ports:
      - "127.0.0.1:${STAGE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage -d stage"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    command:
      - redis-server
      - --requirepass
      - stage-dev-redis
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${STAGE_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "--no-auth-warning", "-a", "stage-dev-redis", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
