stages:
  - quality
  - test
  - contract
  - database

default:
  image: python:3.12-slim
  before_script:
    - pip install --disable-pip-version-check uv==0.13.1
    - uv sync --locked --dev

quality:
  stage: quality
  script:
    - uv run ruff check app tests scripts
    - uv run ruff format --check app tests scripts
    - uv run mypy app tests scripts

tests:
  stage: test
  script:
    - uv run pytest

contract:
  stage: contract
  script:
    - uv run python scripts/check_contract.py --check
    - uv build --wheel --out-dir tmp/distribution
    - uv run python scripts/check_distribution.py tmp/distribution/*.whl

# These credentials are for disposable job-local databases only.
database:postgresql:
  stage: database
  services:
    - name: postgres:17
      alias: postgres
    - name: redis:8
      alias: redis
  variables:
    POSTGRES_DB: stage_ci
    POSTGRES_USER: stage
    POSTGRES_PASSWORD: stage-ci-test-only
    TEST_DATABASE_URL: postgresql+asyncpg://stage:stage-ci-test-only@postgres:5432/stage_ci
    STAGE_ALLOW_TEST_DATABASE_RESET: "1"
    TEST_REDIS_URL: redis://redis:6379/0
  script:
    - uv run python scripts/check_database.py
    - uv run python scripts/check_redis.py
    - uv run pytest -q --junitxml=tmp/postgresql-tests.xml
    - uv run python scripts/check_runtime_conformance.py --junit tmp/postgresql-tests.xml

database:redis:
  stage: database
  services:
    - name: redis:8
      alias: redis
  variables:
    TEST_REDIS_URL: redis://redis:6379/0
  script:
    - uv run python scripts/check_redis.py

database:browser:
  stage: database
  timeout: 15m
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: stage_ci_browser
    POSTGRES_USER: stage
    POSTGRES_PASSWORD: stage-ci-browser-test-only
    TEST_DATABASE_URL: postgresql+asyncpg://stage:stage-ci-browser-test-only@postgres:5432/stage_ci_browser
    STAGE_ALLOW_TEST_DATABASE_RESET: "1"
  script:
    - apt-get update && apt-get install -y --no-install-recommends nodejs npm
    - npm ci --prefix scripts/browser --ignore-scripts
    - npm exec --prefix scripts/browser -- playwright install --with-deps chromium
    - uv run python scripts/check_database.py
    - uv run python scripts/check_browser_acceptance.py
  artifacts:
    when: always
    paths:
      - tmp/browser-tests.xml
    reports:
      junit: tmp/browser-tests.xml
