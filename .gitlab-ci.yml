stages:
  - quality
  - test
  - contract
  - database

default:
  image: python:3.12-slim
  before_script:
    - pip install --disable-pip-version-check uv==0.13.1
    - uv sync --locked --dev

quality:
  stage: quality
  script:
    - uv run ruff check app tests scripts
    - uv run ruff format --check app tests scripts
    - uv run mypy app tests scripts

tests:
  stage: test
  script:
    - uv run pytest

contract:
  stage: contract
  script:
    - uv run python scripts/check_contract.py --check

# These credentials are for disposable job-local databases only.
database:mysql:
  stage: database
  services:
    - name: mysql:8.4
      alias: mysql
  variables:
    MYSQL_DATABASE: stage_ci
    MYSQL_USER: stage
    MYSQL_PASSWORD: stage-ci-test-only
    MYSQL_ROOT_PASSWORD: stage-ci-root-test-only
    TEST_DATABASE_URL: mysql+aiomysql://stage:stage-ci-test-only@mysql:3306/stage_ci
    STAGE_ALLOW_TEST_DATABASE_RESET: "1"
  script:
    - uv run python scripts/check_database.py
    - uv run pytest -q tests/storage

database:postgresql:
  stage: database
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: stage_ci
    POSTGRES_USER: stage
    POSTGRES_PASSWORD: stage-ci-test-only
    TEST_DATABASE_URL: postgresql+asyncpg://stage:stage-ci-test-only@postgres:5432/stage_ci
    STAGE_ALLOW_TEST_DATABASE_RESET: "1"
  script:
    - uv run python scripts/check_database.py
    - uv run pytest -q tests/storage
