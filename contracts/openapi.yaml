        membership_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Membership Ref
          type: string
        membership_status:
          title: Membership Status
          type: string
        membership_version:
          maximum: 2147483647.0
          minimum: 1.0
          title: Membership Version
          type: integer
        principal_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Principal Ref
          type: string
        principal_status:
          title: Principal Status
          type: string
        principal_version:
          maximum: 2147483647.0
          minimum: 1.0
          title: Principal Version
