          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Role Ref
          type: string
        role_revision:
          maximum: 2147483647.0
          minimum: 1.0
          title: Role Revision
          type: integer
        scope_ref:
          maxLength: 256
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Scope Ref
          type: string
      required:
      - role_ref
      - role_revision
      - content_digest
      - scope_ref
      - max_duration_seconds
