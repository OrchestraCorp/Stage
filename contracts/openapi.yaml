          - type: 'null'
          title: Next After
      required:
      - items
      - next_after
      title: AuditList
      type: object
    AuditView:
      additionalProperties: false
      properties:
        actor_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Actor Ref
          type: string
        assignment_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Assignment Ref
          type: string
        completed_at:
          format: date-time
          title: Completed At
          type: string
        operation_ref:
