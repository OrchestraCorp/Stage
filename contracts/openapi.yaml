      - operation_ref
      - operation_type
      - actor_ref
      - assignment_ref
      - request_id
      - target_ref
      - reason
      - completed_at
      - result
      title: AuditView
      type: object
    AuthorityView:
      additionalProperties: false
      properties:
        accepted_at:
