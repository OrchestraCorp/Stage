          type: string
        resource_ref:
          title: Resource Ref
          type: string
        title:
          title: Title
          type: string
        version:
          maximum: 2147483647.0
          minimum: 1.0
          title: Version
          type: integer
      required:
      - resource_ref
      - title
      - description
      - lifecycle
      - classification
      - version
      title: WorkDetailsResult
      type: object
    WorkItemView:
      additionalProperties: false
      properties:
        classification:
          title: Classification
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        lifecycle:
          title: Lifecycle
          type: string
        resource_ref:
          title: Resource Ref
          type: string
        title:
          title: Title
          type: string
        version:
          title: Version
          type: integer
      required:
      - resource_ref
      - title
      - description
