          title: Next After
      required:
      - items
      - next_after
      title: AssignmentList
      type: object
    AssignmentView:
      additionalProperties: false
      description: A selection hint, never a permission decision or reusable grant.
      properties:
        assignment_ref:
          title: Assignment Ref
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        role_code:
          title: Role Code
          type: string
        role_display_name:
          title: Role Display Name
          type: string
        role_ref:
          title: Role Ref
          type: string
        role_revision:
          minimum: 1.0
          title: Role Revision
          type: integer
        scope_ref:
          title: Scope Ref
          type: string
        valid_from:
          format: date-time
          title: Valid From
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - assignment_ref
      - role_ref
      - role_revision
      - role_code
      - role_display_name
      - scope_ref
      - valid_from
      - expires_at
      - version
      title: AssignmentView
      type: object
    AuditList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditView'
          title: Items
          type: array
        next_after:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[^\s\x00-\x1f\x7f]+$
