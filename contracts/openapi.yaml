        membership_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Membership Ref
          type: string
        principal_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Principal Ref
          type: string
      required:
      - principal_ref
      - membership_ref
      - authority
      title: AdministrationMe
      type: object
    AssignmentList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssignmentView'
          title: Items
          type: array
        next_after:
          anyOf:
          - type: string
          - type: 'null'
