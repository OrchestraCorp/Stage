components:
  schemas:
    ErrorDetail:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        request_id:
          title: Request Id
          type: string
      required:
      - code
      - message
      - request_id
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    HealthResponse:
      description: Stable response contract for the process liveness probe.
      properties:
        app:
          description: Configured Stage application name.
          title: App
          type: string
        env:
          description: Configured runtime environment name.
          title: Env
          type: string
        status:
          const: ok
          description: The process is alive.
          title: Status
          type: string
      required:
      - status
      - app
      - env
      title: HealthResponse
      type: object
info:
  description: 组织运行与热协作系统底板
  title: OrchestraCorp Stage
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Returns application process metadata. This endpoint does not probe
        the database or other dependencies.
      operationId: health_liveness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Liveness response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Request validation failed
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error
      summary: Liveness probe
      tags:
      - system
