  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: 组织运行与热协作系统底板
  title: OrchestraCorp Stage
  version: 1.0.0
openapi: 3.1.0
paths:
  /.well-known/oauth-authorization-server:
    get:
      operationId: native_oauth_metadata
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Native Oauth Metadata
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    title: Error
                    type: string
                required:
                - error
                title: OAuthFailure
                type: object
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    title: Error
                    type: string
                required:
                - error
                title: OAuthFailure
                type: object
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    title: Error
                    type: string
                required:
                - error
                title: OAuthFailure
                type: object
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    title: Error
                    type: string
                required:
                - error
                title: OAuthFailure
                type: object
          description: Not Found
        '413':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    title: Error
                    type: string
                required:
                - error
                title: OAuthFailure
                type: object
          description: Request Entity Too Large
        '415':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    title: Error
                    type: string
                required:
                - error
                title: OAuthFailure
                type: object
          description: Unsupported Media Type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Request validation failed
        '429':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    title: Error
                    type: string
                required:
                - error
                title: OAuthFailure
                type: object
          description: Too Many Requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unexpected server error
        '503':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
