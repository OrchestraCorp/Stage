          title: Membership Ref
          type: string
        reason:
          maxLength: 500
          minLength: 1
          title: Reason
          type: string
        role_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Role Ref
          type: string
        role_revision:
          maximum: 2147483647.0
          minimum: 1.0
