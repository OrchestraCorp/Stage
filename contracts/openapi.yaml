      type: object
    CredentialVersionResponse:
      additionalProperties: false
      properties:
        credential_version:
          exclusiveMinimum: 0.0
          title: Credential Version
          type: integer
      required:
      - credential_version
      title: CredentialVersionResponse
      type: object
    ErrorDetail:
