components:
  schemas:
    AccountConsent:
      additionalProperties: false
      properties:
        client_display_name:
          title: Client Display Name
          type: string
        client_id:
          title: Client Id
          type: string
        client_version:
          title: Client Version
          type: integer
        current:
          title: Current
          type: boolean
        granted_at:
          format: date-time
          title: Granted At
          type: string
        scopes:
          items:
            type: string
          title: Scopes
          type: array
      required:
      - client_id
      - client_display_name
      - client_version
      - scopes
      - granted_at
      - current
      title: AccountConsent
      type: object
    AccountConsentPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AccountConsent'
          title: Items
          type: array
        next_after:
          anyOf:
          - type: string
          - type: 'null'
          title: Next After
      required:
      - items
      - next_after
      title: AccountConsentPage
      type: object
    AccountSession:
      additionalProperties: false
      properties:
        active:
          title: Active
          type: boolean
        auth_time:
          format: date-time
          title: Auth Time
          type: string
        client_display_name:
          title: Client Display Name
          type: string
        client_id:
          title: Client Id
          type: string
        current:
          title: Current
          type: boolean
        expires_at:
          format: date-time
          title: Expires At
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        session_ref:
          title: Session Ref
          type: string
      required:
      - session_ref
      - client_id
      - client_display_name
      - auth_time
      - expires_at
      - revoked_at
      - current
      - active
      title: AccountSession
      type: object
    AccountSessionPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AccountSession'
          title: Items
          type: array
        next_after:
          anyOf:
          - type: string
          - type: 'null'
          title: Next After
      required:
      - items
      - next_after
      title: AccountSessionPage
      type: object
    ActivationRequest:
      additionalProperties: false
      properties:
        expected_authority_version:
          maximum: 2147483647.0
          minimum: 1.0
          title: Expected Authority Version
          type: integer
      required:
      - expected_authority_version
      title: ActivationRequest
      type: object
    AdminAssignmentList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminAssignmentView'
          title: Items
          type: array
        next_after:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[^\s\x00-\x1f\x7f]+$
            type: string
          - type: 'null'
          title: Next After
      required:
      - items
      - next_after
      title: AdminAssignmentList
      type: object
    AdminAssignmentView:
      additionalProperties: false
      properties:
        assignment_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Assignment Ref
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        membership_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Membership Ref
          type: string
        principal_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Principal Ref
          type: string
        role_code:
          title: Role Code
          type: string
        role_display_name:
          title: Role Display Name
          type: string
        role_ref:
          maxLength: 128
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Role Ref
          type: string
        role_revision:
          maximum: 2147483647.0
          minimum: 1.0
          title: Role Revision
          type: integer
        scope_ref:
          maxLength: 256
          minLength: 1
          pattern: ^[^\s\x00-\x1f\x7f]+$
          title: Scope Ref
          type: string
        status:
          title: Status
          type: string
        valid_from:
          format: date-time
          title: Valid From
          type: string
        version:
          maximum: 2147483647.0
          minimum: 1.0
          title: Version
          type: integer
      required:
      - principal_ref
      - membership_ref
      - assignment_ref
      - role_ref
      - role_revision
      - role_code
      - role_display_name
      - scope_ref
      - valid_from
      - expires_at
      - status
      - version
      title: AdminAssignmentView
      type: object
    AdministrationMe:
      additionalProperties: false
      properties:
        authority:
          anyOf:
          - $ref: '#/components/schemas/AuthorityView'
