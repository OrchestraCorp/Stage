name: Stage checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --dev
      - run: uv run ruff check app tests scripts
      - run: uv run ruff format --check app tests scripts
      - run: uv run mypy app tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/check_contract.py --check

  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stage_ci
          POSTGRES_USER: stage
          POSTGRES_PASSWORD: stage-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stage -d stage_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -e ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Disposable databases created for this job only.
      TEST_DATABASE_URL: postgresql+asyncpg://stage:stage-ci-test-only@127.0.0.1:5432/stage_ci
      STAGE_ALLOW_TEST_DATABASE_RESET: "1"
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --dev
      - run: uv run python scripts/check_database.py
      - run: uv run python scripts/check_redis.py
      - run: uv run pytest -q --junitxml=tmp/postgresql-tests.xml
      - run: uv run python scripts/check_runtime_conformance.py --junit tmp/postgresql-tests.xml
