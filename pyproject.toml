[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
migrations = ["script.py.mako"]

[project]
name = "orchestra-stage"
version = "0.1.0"
description = "OrchestraCorp Stage — 组织运行与热协作系统底板"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.20",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "loguru>=0.7.0",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
    "authlib>=1.6,<2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx[socks]>=0.27.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
